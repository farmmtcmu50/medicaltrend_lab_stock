<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>เปิดใช้งานบัญชี Stock</title><link rel="stylesheet" href="/styles.css"><script src="/setup.js" defer></script></head>
<body><main class="login-shell"><section class="login-panel"><h1>เปิดใช้งานบัญชี Stock</h1><p>ตั้งรหัสผ่านสำหรับผู้ดูแลลูกค้า Username: <strong>admin</strong></p><form id="setupForm" class="stack"><label>รหัสเปิดใช้งาน<input name="token" required autocomplete="off" type="password"></label><label>รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)<input name="password" required minlength="12" maxlength="128" type="password" autocomplete="new-password"></label><label>ยืนยันรหัสผ่าน<input name="confirm" required minlength="12" type="password" autocomplete="new-password"></label><button class="primary">ตั้งรหัสผ่านและเปิดใช้งาน</button><p id="setupMessage" role="status"></p></form><p><a href="/">กลับหน้าเข้าสู่ระบบ</a></p></section></main></body></html>
